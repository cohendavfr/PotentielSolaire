<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NAME__ solaire 3D</title>
<style>
  :root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#1d2a2f;--mute:#6b7478;--line:#ddd6c6;--acc:#d9822b}
  @media (prefers-color-scheme:dark){:root{--bg:#14191b;--panel:#1d2427;--ink:#e8e6df;--mute:#97a0a3;--line:#323c40;--acc:#f0a050}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
  #c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:0 4px 18px rgba(0,0,0,.12)}
  #side{top:16px;left:16px;width:310px;max-height:calc(100% - 32px);display:flex;flex-direction:column;gap:10px;z-index:5}
  h1{font-size:17px;margin:0}
  .sub{color:var(--mute);font-size:12px;margin:0}
  .bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#c0392b,#e8a33a,#f2d64b,#6dbb4a,#1f9d55)}
  .scale{display:flex;justify-content:space-between;font-size:11px;color:var(--mute)}
  label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
  input[type=range]{width:100%}
  #q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  #res{position:relative}
  #sugg{position:absolute;left:0;right:0;top:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;z-index:9;display:none;max-height:240px;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  #sugg div{padding:6px 10px;cursor:pointer;font-size:13px}
  #sugg div:hover,#sugg div.on{background:rgba(127,127,127,.18)}
  #top{overflow:auto;border-top:1px solid var(--line);padding-top:8px;min-height:60px}
  .row{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;padding:5px 4px;border-radius:6px;cursor:pointer;font-size:12px}
  .row:hover{background:rgba(127,127,127,.15)}
  .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .row .meta{color:var(--mute);margin-left:auto;white-space:nowrap}
  .row .ad{flex-basis:100%;padding-left:18px;color:var(--mute);font-size:11px}
  #info{right:16px;bottom:16px;width:280px;display:none;z-index:5}
  #info h2{font-size:14px;margin:0 0 2px}
  #info .ad{margin:0 0 8px;font-size:13px;color:var(--acc);font-weight:600}
  #info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:13px}
  #info dt{color:var(--mute)} #info dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  #hint{right:16px;top:16px;font-size:12px;color:var(--mute);padding:8px 12px;max-width:330px;z-index:4}
  #hint b{color:var(--ink)}
  /* barre d'outils de navigation */
  #nav{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;align-items:center;padding:8px 10px;z-index:5}
  #nav button,#mode{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;min-width:36px;height:36px;font:inherit;font-size:16px;cursor:pointer;padding:0 8px}
  #nav button:hover,#mode:hover{border-color:var(--acc)}
  #nav .sep{width:1px;height:24px;background:var(--line);margin:0 2px}
  #mode{font-size:12px}
  #mode.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  #north{padding:0!important;width:40px;height:40px;position:relative}
  #north svg{width:100%;height:100%;transition:none}
  /* étiquettes */
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
  .lb{position:absolute;left:0;top:0;white-space:nowrap;transform-origin:0 0;will-change:transform}
  .st{font:600 11px/1 system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;color:#fff;
      text-shadow:0 0 3px #000,0 0 3px #000,0 1px 4px #000}
  .no{font:700 10px/1 system-ui,sans-serif;color:#10242b;background:rgba(255,255,255,.88);border-radius:4px;padding:2px 4px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  @media(max-width:760px){#side{width:calc(100% - 32px);max-height:40%}#hint{display:none}#info{left:16px;right:16px;width:auto;bottom:76px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>

<div class="panel" id="side">
  <div><h1><span id="cname"></span> · potentiel solaire</h1>
  <p class="sub"><a href="__HOME__" style="color:var(--acc)">← Choisir une autre ville</a></p>
  <p class="sub" style="margin-top:4px">Toits résidentiels : orientation, pente, ombrage des arbres et du bâti. Estimation indicative.</p></div>
  <div id="res"><input id="q" type="search" placeholder="Chercher une adresse…" autocomplete="off"><div id="sugg"></div></div>
  <label>Couleur selon
    <select id="metric" style="flex:1;padding:5px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit">
      <option value="yield">Rendement du meilleur pan (kWh/kWc/an)</option>
      <option value="prod">Production potentielle (kWh/an)</option>
    </select></label>
  <div><div class="bar" id="bar"></div><div class="scale"><span id="s0"></span><span id="s1"></span><span id="s2"></span></div></div>
  <label>Rendement relatif mini <input type="range" id="min" min="0" max="100" value="0" style="flex:1"><b id="minv">0 %</b></label>
  <label><span>Noms de rues</span><input type="checkbox" id="streets" checked></label>
  <label><span>Numéros</span><input type="checkbox" id="nums" checked></label>
  <label><span>Bâtiments non analysés</span><input type="checkbox" id="others" checked></label>
  <label><span>Orthophoto</span><input type="checkbox" id="photo" checked></label>
  <div id="top"></div>
</div>

<div class="panel" id="hint"></div>
<div class="panel" id="info"></div>

<div class="panel" id="nav">
  <button id="rl" title="Tourner à gauche (Q)">⟲</button>
  <button id="rr" title="Tourner à droite (E)">⟳</button>
  <button id="tu" title="Incliner : vue plus rasante (Maj+↑)">⤒</button>
  <button id="td" title="Incliner : vue plus verticale (Maj+↓)">⤓</button>
  <span class="sep"></span>
  <button id="zi" title="Zoom avant (+)">＋</button>
  <button id="zo" title="Zoom arrière (−)">−</button>
  <span class="sep"></span>
  <button id="north" title="Orienter le nord en haut (R)"><svg viewBox="0 0 40 40" id="needle"><circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" opacity=".25"/><path d="M20 5 L25 21 L20 18 L15 21Z" fill="#c0392b"/><path d="M20 35 L25 21 L20 24 L15 21Z" fill="currentColor" opacity=".45"/><text x="20" y="14" font-size="0" fill="currentColor">N</text></svg></button>
  <button id="top2" title="Vue de dessus (T)">⌖</button>
  <span class="sep"></span>
  <button id="mode" title="Basculer le glissé à un doigt : tourner / déplacer">Tourner</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const DATA = __DATA__;
const ORTHO = "data:image/jpeg;base64,__ORTHO__";
const $ = id => document.getElementById(id);

const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
const dark = matchMedia('(prefers-color-scheme:dark)').matches;
scene.background = new THREE.Color(dark ? 0x14191b : 0xdfe6ea);
const camera = new THREE.PerspectiveCamera(45, 1, 3, 14000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = false;
controls.enableZoom = false;        // zoom géré à la main (pavé tactile)
controls.enableKeys = false;
controls.screenSpacePanning = false;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minPolarAngle = 0.02;

scene.add(new THREE.HemisphereLight(0xffffff, 0x667788, 0.75));
const sun = new THREE.DirectionalLight(0xfff3dd, 0.9);
sun.position.set(-600, 1200, 800);
scene.add(sun);

// sol = orthophoto IGN (nord = -z)
const groundMat = new THREE.MeshBasicMaterial({color: 0x8a9a8a});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(DATA.w, DATA.h), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
new THREE.TextureLoader().load(ORTHO, t => {
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  groundMat.map = t; groundMat.color.set(0xffffff); groundMat.needsUpdate = true;
});

// ---------------------------------------------------------------- bâtiments
const stops = [[.5,[192,57,43]],[.7,[232,163,58]],[.82,[242,214,75]],[.92,[109,187,74]],[1,[31,157,85]]];
function ramp(r){
  if (r <= stops[0][0]) return new THREE.Color(...stops[0][1].map(v=>v/255));
  for (let i = 1; i < stops.length; i++) if (r <= stops[i][0]) {
    const [a, ca] = stops[i-1], [b, cb] = stops[i], t = (r-a)/(b-a);
    return new THREE.Color(...ca.map((v,k)=>(v+(cb[k]-v)*t)/255));
  }
  return new THREE.Color(...stops[stops.length-1][1].map(v=>v/255));
}
const rampT = t => ramp(0.5 + 0.5 * t);
const GREY = new THREE.Color(dark ? 0x56606a : 0xb9b4a8);
const NONE = new THREE.Color(dark ? 0x6a5a4e : 0xc9b8a6);   // analysé mais aucun pan exploitable
let metric = 'yield', lo = 0, hi = 1;
const mval = b => metric === 'yield' ? b.y : Math.log10(Math.max(b.kwh, 1));
const quant = (arr, p) => arr[Math.floor(p * (arr.length - 1))];
const fmt = n => n >= 1000 ? (n / 1000).toLocaleString('fr-FR', {maximumFractionDigits: 1}) + ' MWh' : Math.round(n) + ' kWh';
function setScale(){
  const v = DATA.buildings.filter(b => b.ratio !== undefined && (metric === 'yield' || b.kwh > 0)).map(mval).sort((a, b) => a - b);
  lo = quant(v, 0.03); hi = quant(v, 0.97);
  if (hi - lo < 1e-6) hi = lo + 1;
  const g = [0, .25, .5, .75, 1].map(t => '#' + rampT(t).getHexString()).join(',');
  $('bar').style.background = `linear-gradient(90deg,${g})`;
  if (metric === 'yield') {
    $('s0').textContent = Math.round(lo / 10) * 10; $('s1').textContent = 'kWh/kWc/an'; $('s2').textContent = Math.round(hi / 10) * 10;
  } else {
    $('s0').textContent = fmt(Math.pow(10, lo)); $('s1').textContent = 'kWh/an (échelle log.)'; $('s2').textContent = fmt(Math.pow(10, hi));
  }
}
function roofColor(b){
  if (b.ratio === undefined) return GREY;
  if (metric === 'prod' && b.kwh <= 0) return NONE;
  return rampT(Math.min(1, Math.max(0, (mval(b) - lo) / (hi - lo))));
}
const WALL = new THREE.Color(dark ? 0x8a8f94 : 0xf2eee4);

const meshes = [];
DATA.buildings.forEach((b, idx) => {
  const shape = new THREE.Shape(b.r.map(p => new THREE.Vector2(p[0], p[1])));
  (b.holes || []).forEach(h => shape.holes.push(new THREE.Path(h.map(p => new THREE.Vector2(p[0], p[1])))));
  const geo = new THREE.ExtrudeGeometry(shape, {depth: b.h, bevelEnabled: false});
  geo.rotateX(-Math.PI / 2);
  const analysed = b.ratio !== undefined;
  const roof = new THREE.MeshLambertMaterial({color: GREY});
  const wall = new THREE.MeshLambertMaterial({color: WALL});
  const m = new THREE.Mesh(geo, [roof, wall]);
  m.userData = {b, analysed, idx};
  scene.add(m); meshes.push(m);
});

const analysedMeshes = meshes.filter(m => m.userData.analysed);
let ranked = analysedMeshes.slice();
function setMetric(k){
  metric = k; setScale();
  ranked = analysedMeshes.slice().sort(k === 'yield'
    ? (a, b) => b.userData.b.y - a.userData.b.y || b.userData.b.kwh - a.userData.b.kwh
    : (a, b) => b.userData.b.kwh - a.userData.b.kwh || b.userData.b.y - a.userData.b.y);
  ranked.forEach((m, i) => m.userData.rank = i + 1);
  analysedMeshes.forEach(m => m.material[0].color.copy(roofColor(m.userData.b)));
  if (typeof applyFilters === 'function' && selected) select(selected, false);
  if (typeof applyFilters === 'function') applyFilters();
}

const topEl = $('top');
function compass(az){ return ['N','NE','E','SE','S','SO','O','NO'][Math.round(((az % 360) + 360) % 360 / 45) % 8]; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderTop(){
  const min = +$('min').value / 100;
  const list = ranked.filter(m => m.userData.b.ratio >= min);
  topEl.innerHTML = `<p class="sub" style="margin-bottom:6px">${list.length} bâtiments · top 25</p>` +
    list.slice(0, 25).map(m => {
      const b = m.userData.b, c = '#' + roofColor(b).getHexString();
      return `<div class="row" data-i="${m.userData.idx}"><i class="dot" style="background:${c}"></i><b>#${m.userData.rank}</b>
        <span>${Math.round(b.y)} kWh/kWc</span><span class="meta">${compass(b.az)} · ${Math.round(b.tilt)}° · ${fmt(b.kwh)}/an</span>
        ${b.a ? `<span class="ad">${esc(b.a)}</span>` : ''}</div>`;
    }).join('');
}
topEl.addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return;
  select(meshes[+r.dataset.i], true);
});

function applyFilters(){
  const min = +$('min').value / 100;
  const others = $('others').checked;
  $('minv').textContent = Math.round(min * 100) + ' %';
  meshes.forEach(m => { m.visible = m.userData.analysed ? m.userData.b.ratio >= min : others; });
  renderTop();
}
['min','others'].forEach(id => $(id).addEventListener('input', applyFilters));
$('metric').addEventListener('input', e => setMetric(e.target.value));
$('photo').addEventListener('input', e => { ground.visible = e.target.checked; });

// ---------------------------------------------------------------- sélection
const info = $('info');
let selected = null;
function select(m, fly){
  if (selected) selected.material.forEach(mt => mt.emissive.set(0x000000));
  selected = m;
  if (!m) { info.style.display = 'none'; return; }
  m.material.forEach(mt => mt.emissive.set(0x333333));
  const b = m.userData.b;
  info.style.display = 'block';
  const ad = b.a ? `<p class="ad">${esc(b.a)}</p>` : '';
  info.innerHTML = m.userData.analysed
    ? `<h2>Bâtiment #${m.userData.rank}</h2>${ad}<dl>
       <dt>Rendement relatif</dt><dd>${Math.round(b.ratio*100)} %</dd>
       <dt>Orientation</dt><dd>${Math.round(b.az)}° (${compass(b.az)})</dd>
       <dt>Pente</dt><dd>${Math.round(b.tilt)}°</dd>
       <dt>Rendement</dt><dd>${Math.round(b.y)} kWh/kWc/an</dd>
       <dt>Ombrage du pan</dt><dd>${(b.shade*100).toFixed(1)} %</dd>
       <dt>· dont arbres</dt><dd>${(b.sa*100).toFixed(1)} %</dd>
       <dt>· dont bâti</dt><dd>${(b.sb*100).toFixed(1)} %</dd>
       <dt>Puissance (bons pans)</dt><dd>${(b.kw).toFixed(1)} kWc</dd>
       <dt>Production (bons pans)</dt><dd>${Math.round(b.kwh).toLocaleString('fr-FR')} kWh/an</dd>
       <dt>Hauteur</dt><dd>${b.h} m</dd></dl>`
    : `<h2>Bâtiment non analysé</h2>${ad}<dl><dt>Hauteur</dt><dd>${b.h} m</dd></dl>`;
  if (fly) flyTo(new THREE.Vector3(b.cx, b.h, -b.cy), 130, 0.9);
}

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
let down = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; canvas.focus(); });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(meshes.filter(m => m.visible))[0];
  select(hit ? hit.object : null, false);
});

// ---------------------------------------------------------------- navigation (pavé tactile Mac)
const sph = new THREE.Spherical(), off = new THREE.Vector3();
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function getView(){ off.copy(camera.position).sub(controls.target); sph.setFromVector3(off); return sph; }
function setView(s){
  s.phi = clamp(s.phi, 0.02, Math.PI * 0.49);
  s.radius = clamp(s.radius, 25, 5500);
  s.makeSafe();
  off.setFromSpherical(s);
  camera.position.copy(controls.target).add(off);
  camera.lookAt(controls.target);
}
function rotate(dTheta, dPhi){ const s = getView(); s.theta += dTheta; s.phi += dPhi; setView(s); }
function dolly(f){ const s = getView(); s.radius *= f; setView(s); }
const bound = Math.max(DATA.w, DATA.h) / 2;
function pan(dx, dy){            // dx : droite écran, dy : avant (vers le haut de l'écran), en mètres
  const s = getView(), az = s.theta;
  const rx = Math.cos(az), rz = -Math.sin(az), fx = -Math.sin(az), fz = -Math.cos(az);
  controls.target.x = clamp(controls.target.x + rx * dx + fx * dy, -bound, bound);
  controls.target.z = clamp(controls.target.z + rz * dx + fz * dy, -bound, bound);
  setView(s);
}

let padMode = true;  // true : pavé tactile ; false : souris à molette
const modeBtn = $('mode');
let dragPan = false;
function setDrag(p){
  dragPan = p;
  controls.mouseButtons.LEFT = p ? THREE.MOUSE.PAN : THREE.MOUSE.ROTATE;
  controls.mouseButtons.RIGHT = p ? THREE.MOUSE.ROTATE : THREE.MOUSE.PAN;
  modeBtn.textContent = p ? 'Déplacer' : 'Tourner';
  modeBtn.classList.toggle('on', p);
  hint();
}
modeBtn.addEventListener('click', () => setDrag(!dragPan));
function hint(){
  $('hint').innerHTML = padMode
    ? `<b>Pavé tactile</b> : deux doigts = <b>déplacer</b> · pincer = <b>zoom</b> · <b>⌥ Option</b> + deux doigts = <b>tourner / incliner</b> · glisser à un doigt (clic enfoncé) = ${dragPan ? 'déplacer' : 'tourner'}.<br>Clavier : flèches déplacer · + / − zoom · Q / E tourner · R nord · T dessus.
       <a href="#" id="swm" style="color:var(--acc)">J'utilise une souris</a>`
    : `<b>Souris</b> : molette = <b>zoom</b> · glisser = ${dragPan ? 'déplacer' : 'tourner'} · clic droit = ${dragPan ? 'tourner' : 'déplacer'}.<br>Clavier : flèches · + / − · Q / E · R nord · T dessus.
       <a href="#" id="swm" style="color:var(--acc)">J'utilise un pavé tactile</a>`;
  $('swm').addEventListener('click', e => { e.preventDefault(); padMode = !padMode; hint(); });
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  let dx = e.deltaX, dy = e.deltaY;
  if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
  const s = getView();
  if (e.ctrlKey) {                       // pincement (Chrome/Firefox) ou ctrl + molette
    dolly(Math.exp(dy * 0.012));
  } else if (!padMode) {
    dolly(Math.exp(dy * 0.0015));
  } else if (e.altKey || e.shiftKey) {   // Option / Maj + deux doigts : orbite
    rotate(-dx * 0.006, -dy * 0.006);
  } else {                               // deux doigts : déplacement dans le plan
    const k = s.radius * 0.0011;
    pan(dx * k, -dy * k);
  }
}, {passive:false});

// Safari : pincement et rotation à deux doigts
let g0 = null;
canvas.addEventListener('gesturestart', e => { e.preventDefault(); g0 = {s: e.scale, r: e.rotation}; });
canvas.addEventListener('gesturechange', e => {
  e.preventDefault(); if (!g0) return;
  dolly(g0.s / e.scale);
  rotate(-(e.rotation - g0.r) * Math.PI / 180, 0);
  g0 = {s: e.scale, r: e.rotation};
});
canvas.addEventListener('gestureend', e => { e.preventDefault(); g0 = null; });

// animation de caméra
let anim = null;
function flyTo(target, dist, phi, theta){
  const s = getView();
  anim = {t0: performance.now(), dur: 650, fromT: controls.target.clone(),
          toT: target.clone(), fromR: s.radius, toR: dist ?? s.radius,
          fromP: s.phi, toP: phi ?? s.phi, fromTh: s.theta,
          toTh: theta === undefined ? s.theta : theta};
  if (theta !== undefined) { // plus court chemin angulaire
    let d = anim.toTh - anim.fromTh; d = Math.atan2(Math.sin(d), Math.cos(d)); anim.toTh = anim.fromTh + d;
  }
}
function stepAnim(){
  if (!anim) return;
  let t = (performance.now() - anim.t0) / anim.dur;
  const e = t >= 1 ? 1 : 1 - Math.pow(1 - t, 3);
  controls.target.lerpVectors(anim.fromT, anim.toT, e);
  const s = getView();
  s.radius = anim.fromR + (anim.toR - anim.fromR) * e;
  s.phi = anim.fromP + (anim.toP - anim.fromP) * e;
  s.theta = anim.fromTh + (anim.toTh - anim.fromTh) * e;
  setView(s);
  if (t >= 1) anim = null;
}
controls.addEventListener('start', () => anim = null);
canvas.addEventListener('wheel', () => anim = null, {passive:true});

const home = {};
function resetView(){ flyTo(home.target, home.dist, 1.0, 0); }
$('rl').onclick = () => flyTo(controls.target, undefined, undefined, getView().theta + Math.PI/4);
$('rr').onclick = () => flyTo(controls.target, undefined, undefined, getView().theta - Math.PI/4);
$('tu').onclick = () => rotate(0, 0.2);
$('td').onclick = () => rotate(0, -0.2);
$('zi').onclick = () => dolly(0.7);
$('zo').onclick = () => dolly(1 / 0.7);
$('north').onclick = () => flyTo(controls.target, undefined, undefined, 0);
$('top2').onclick = () => flyTo(controls.target, undefined, 0.02, 0);
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key, st = getView().radius * 0.06;
  if (k === 'ArrowUp') e.shiftKey ? rotate(0, 0.08) : pan(0, st);
  else if (k === 'ArrowDown') e.shiftKey ? rotate(0, -0.08) : pan(0, -st);
  else if (k === 'ArrowLeft') pan(-st, 0);
  else if (k === 'ArrowRight') pan(st, 0);
  else if (k === '+' || k === '=') dolly(0.85);
  else if (k === '-' || k === '_') dolly(1 / 0.85);
  else if (k === 'q' || k === 'Q') rotate(0.1, 0);
  else if (k === 'e' || k === 'E') rotate(-0.1, 0);
  else if (k === 'r' || k === 'R') flyTo(controls.target, undefined, undefined, 0);
  else if (k === 't' || k === 'T') flyTo(controls.target, undefined, 0.02, 0);
  else return;
  e.preventDefault();
});

// ---------------------------------------------------------------- recherche d'adresse
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const addrIdx = DATA.addresses.map(a => ({a, k: norm(a[0])}));
const q = $('q'), sugg = $('sugg');
let hits = [], cur = -1;
function showSugg(){
  const t = norm(q.value.trim());
  if (t.length < 2) { sugg.style.display = 'none'; hits = []; return; }
  const words = t.split(/\s+/);
  hits = addrIdx.filter(x => words.every(w => x.k.includes(w))).slice(0, 8);
  sugg.innerHTML = hits.map((h, i) => `<div data-i="${i}">${esc(h.a[0])}</div>`).join('') || '<div style="color:var(--mute)">Aucune adresse</div>';
  sugg.style.display = 'block'; cur = -1;
}
function goAddr(h){
  const [label, x, y, mi] = h.a;
  sugg.style.display = 'none'; q.value = label;
  if (mi >= 0) { select(meshes[mi], false); const b = meshes[mi].userData.b; flyTo(new THREE.Vector3(b.cx, b.h, -b.cy), 110, 0.9); }
  else flyTo(new THREE.Vector3(x, 3, -y), 110, 0.9);
}
q.addEventListener('input', showSugg);
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { cur = Math.min(cur + 1, hits.length - 1); }
  else if (e.key === 'ArrowUp') { cur = Math.max(cur - 1, 0); }
  else if (e.key === 'Enter' && hits.length) { goAddr(hits[Math.max(cur, 0)]); return; }
  else if (e.key === 'Escape') { sugg.style.display = 'none'; return; }
  else return;
  [...sugg.children].forEach((c, i) => c.classList.toggle('on', i === cur));
  e.preventDefault();
});
sugg.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) goAddr(hits[+d.dataset.i]); });

// ---------------------------------------------------------------- étiquettes (rues + numéros)
const layer = $('labels');
const streetEls = DATA.streets.map(s => {
  const el = document.createElement('div'); el.className = 'lb st'; el.textContent = s[0];
  el.style.display = 'none'; layer.appendChild(el); return {el, s, w: 0};
});
streetEls.sort((a, b) => a.s[5] - b.s[5]);   // importance puis ordre
const numEls = DATA.buildings.map((b, i) => b.n ? {b, i} : null).filter(Boolean).map(o => {
  const el = document.createElement('div'); el.className = 'lb no'; el.textContent = o.b.n;
  el.style.display = 'none'; layer.appendChild(el); return {el, b: o.b, i: o.i, w: 0};
});
requestAnimationFrame(() => {   // largeurs une fois la police prête
  streetEls.forEach(o => { o.el.style.display = 'block'; o.w = o.el.offsetWidth; o.el.style.display = 'none'; });
  numEls.forEach(o => { o.el.style.display = 'block'; o.w = o.el.offsetWidth; o.el.style.display = 'none'; });
});
const v = new THREE.Vector3(), v2 = new THREE.Vector3();
function toScreen(x, y, z, out){
  v.set(x, y, z).project(camera);
  if (v.z > 1 || v.z < -1) return false;
  out.x = (v.x * 0.5 + 0.5) * innerWidth; out.y = (-v.y * 0.5 + 0.5) * innerHeight; return true;
}
const p1 = {x:0,y:0}, p2 = {x:0,y:0};
const hit = (a, b) => !(a.x2 < b.x1 || a.x1 > b.x2 || a.y2 < b.y1 || a.y1 > b.y2);
function updateLabels(){
  const rects = [];
  const free = r => { for (const o of rects) if (hit(r, o)) return false; return true; };
  const dist = camera.position.distanceTo(controls.target);
  const show = {st: $('streets').checked, no: $('nums').checked};
  const sideRect = $('side').getBoundingClientRect();
  rects.push({x1: sideRect.left, y1: sideRect.top, x2: sideRect.right, y2: sideRect.bottom});
  for (const o of numEls) {   // numéros : seulement de près
    const m = meshes[o.i];
    if (!show.no || dist > 420 || !m.visible || !toScreen(o.b.cx, o.b.h + 1, -o.b.cy, p1)) { if (o.on) { o.el.style.display = 'none'; o.on = false; } continue; }
    const r = {x1: p1.x - o.w/2, x2: p1.x + o.w/2, y1: p1.y - 8, y2: p1.y + 8};
    if (p1.x < 0 || p1.y < 0 || p1.x > innerWidth || p1.y > innerHeight || !free(r)) { if (o.on) { o.el.style.display = 'none'; o.on = false; } continue; }
    rects.push(r);
    o.el.style.display = 'block'; o.on = true;
    o.el.style.transform = `translate(${(p1.x - o.w/2).toFixed(1)}px,${(p1.y - 8).toFixed(1)}px)`;
  }
  const maxSt = dist > 2600 ? 40 : 400;
  let n = 0;
  for (const o of streetEls) {
    const [, x, y, dx, dy] = o.s;
    let ok = show.st && n < maxSt && o.w && toScreen(x, 1.5, -y, p1) && toScreen(x + dx, 1.5, -(y + dy), p2);
    let r;
    if (ok) {
      let ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
      if (ang > Math.PI/2) ang -= Math.PI; else if (ang < -Math.PI/2) ang += Math.PI;
      const c = Math.abs(Math.cos(ang)), s = Math.abs(Math.sin(ang));
      const hw = (o.w * c + 12 * s) / 2 + 3, hh = (o.w * s + 12 * c) / 2 + 3;
      r = {x1: p1.x - hw, x2: p1.x + hw, y1: p1.y - hh, y2: p1.y + hh};
      ok = p1.x > -50 && p1.y > -20 && p1.x < innerWidth + 50 && p1.y < innerHeight + 20 && free(r);
      if (ok) o.ang = ang;
    }
    if (!ok) { if (o.on) { o.el.style.display = 'none'; o.on = false; } continue; }
    rects.push(r); n++;
    o.el.style.display = 'block'; o.on = true;
    o.el.style.transform = `translate(${p1.x.toFixed(1)}px,${p1.y.toFixed(1)}px) rotate(${o.ang.toFixed(3)}rad) translate(${(-o.w/2).toFixed(1)}px,-6px)`;
  }
  // boussole
  const th = getView().theta;
  $('needle').style.transform = `rotate(${th}rad)`;
}

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// cadrage initial sur les bâtiments analysés
(function frame(){
  const bb = new THREE.Box3();
  ranked.forEach(m => bb.expandByObject(m));
  const c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
  home.target = c; home.dist = Math.max(sz.x, sz.z) * 1.1 + 250;
  controls.target.copy(c);
  camera.position.set(c.x, home.dist * 0.7, c.z + home.dist * 0.7);
  camera.lookAt(c);
})();
$('cname').textContent = DATA.meta.nom;
setDrag(false);
setMetric('yield');
(function loop(){ stepAnim(); controls.update(); renderer.render(scene, camera); updateLabels(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
